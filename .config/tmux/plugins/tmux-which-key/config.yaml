# yaml-language-server: $schema=../../../../.tmux/plugins/tmux-which-key/config.schema.yaml
#
# tmux-which-key menu. Lives here (XDG path, @tmux-which-key-xdg-enable 1 in
# .tmux.conf) instead of the plugin's own directory so it's versioned in this
# repo — .gitignore drops all of .tmux/plugins/.
#
# The plugin rebuilds ~/.local/share/tmux/plugins/tmux-which-key/init.tmux from
# this file every time tmux loads it, so `prefix + r` picks up edits.

command_alias_start_index: 200

keybindings:
  # prefix + Space is already `last-window` here, and a root-table C-Space
  # would swallow nvim-cmp's completion key inside every pane — so the menu
  # hangs off prefix + ? instead. The raw `list-keys -N` listing that used to
  # own that key is still one keypress away, under +Keys.
  prefix_table: '?'
  # root_table: C-Space

title:
  style: align=centre,bold
  prefix: tmux
  # Was a hardcoded fg=green, which ignored the active theme.
  prefix_style: fg=#{@theme-accent},align=centre,bold

# Centred, not the plugin's default right/pane corner: prefix + m opens this
# same menu on the phone, where the old hand-rolled menu was centred for
# thumb-tapping.
position:
  x: C
  y: C

custom_variables:
  - name: log_info
    value: '#[fg=green,italics] [info]#[default]#[italics]'

macros:
  - name: reload-config
    commands:
      - display "#{log_info} Loading config... "
      - source-file $HOME/.tmux.conf
      - display -p "\n\n... Press ENTER to continue"
  - name: restart-pane
    commands:
      - display "#{log_info} Restarting pane"
      - 'respawnp -k -c #{pane_current_path}'

items:
  - name: Run
    key: space
    command: command-prompt
  - name: Last window
    key: tab
    command: last-window
  - name: Last pane
    key: '`'
    command: last-pane
  - name: Copy
    key: c
    menu:
      - name: Copy
        key: c
        command: copy-mode
      - name: List buffers
        key: '#'
        command: list-buffers
  - separator: true

  - name: +Agents
    key: a
    menu:
      - name: Session picker (tmux-scout)
        key: '`'
        command: run-shell -b $TMUX_PLUGIN_MANAGER_PATH/tmux-scout/scripts/picker/picker.sh
      - name: Next pane awaiting input
        key: '~'
        command: run-shell -b tmux-scout-next-wait
      - separator: true
      - name: Toggle window sidebar
        key: W
        command: run-shell -b tmux-sidebar-toggle
      # Braces, not nested single quotes: the generated menu string is itself
      # single-quoted, so a `'%1'` in here would close it and break the parse.
      - name: New vault session
        key: V
        command: 'command-prompt -I vault -p "vault session name:" { new-window -c /opt/docker-config/obsidian/Metcalf -n "%1" "claude --remote-control %1" }'

  - name: +Tools
    key: t
    menu:
      # Quoted scalar: unquoted, YAML would treat ` #{pane_id}` as a comment.
      - name: Extract text (extrakto)
        key: e
        command: 'run-shell "$TMUX_PLUGIN_MANAGER_PATH/extrakto/scripts/open.sh #{pane_id}"'
      - name: Fuzzy finder (tmux-fzf)
        key: f
        command: run-shell -b $TMUX_PLUGIN_MANAGER_PATH/tmux-fzf/main.sh
      - separator: true
      - name: Toggle pane logging
        key: l
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tmux-logging/scripts/toggle_logging.sh
      - name: Save complete history
        key: h
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tmux-logging/scripts/save_complete_history.sh
      - name: Screen capture
        key: s
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tmux-logging/scripts/screen_capture.sh
      - name: Clear pane history
        key: C
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tmux-logging/scripts/clear_history.sh
      - separator: true
      - name: Copy pane path
        key: y
        command: run-shell -b $TMUX_PLUGIN_MANAGER_PATH/tmux-yank/scripts/copy_pane_pwd.sh

  - name: +Theme
    key: T
    menu:
      - name: Tokyo Night
        key: t
        command: run-shell -b "~/.homedir/tmarchy/bin/tmarchy-theme set tokyo-night"
      - name: Catppuccin
        key: c
        command: run-shell -b "~/.homedir/tmarchy/bin/tmarchy-theme set catppuccin"
      - name: Everforest
        key: e
        command: run-shell -b "~/.homedir/tmarchy/bin/tmarchy-theme set everforest"
      - name: Gruvbox
        key: g
        command: run-shell -b "~/.homedir/tmarchy/bin/tmarchy-theme set gruvbox"
      - name: Kanagawa
        key: k
        command: run-shell -b "~/.homedir/tmarchy/bin/tmarchy-theme set kanagawa"
      - name: Nord
        key: n
        command: run-shell -b "~/.homedir/tmarchy/bin/tmarchy-theme set nord"
      - name: Rose Pine
        key: r
        command: run-shell -b "~/.homedir/tmarchy/bin/tmarchy-theme set rose-pine"
      - name: Matte Black
        key: m
        command: run-shell -b "~/.homedir/tmarchy/bin/tmarchy-theme set matte-black"
      - name: Jewel (pre-tmarchy)
        key: j
        command: run-shell -b "~/.homedir/tmarchy/bin/tmarchy-theme set jewel"

  - name: +Windows
    key: w
    menu:
      - name: Last
        key: tab
        command: last-window
      - name: Choose
        key: w
        command: choose-tree -Zw
      - name: Previous
        key: p
        command: previous-window
      - name: Next
        key: n
        command: next-window
      - name: New
        key: c
        command: 'neww -c #{pane_current_path}'
      - separator: true
      - name: +Layout
        key: l
        menu:
          - name: Next
            key: l
            command: nextl
            transient: true
          - name: Tiled
            key: t
            command: selectl tiled
          - name: Horizontal
            key: h
            command: selectl even-horizontal
          - name: Vertical
            key: v
            command: selectl even-vertical
          - name: Horizontal main
            key: H
            command: selectl main-horizontal
          - name: Vertical main
            key: V
            command: selectl main-vertical
      - name: Split horizontal
        key: /
        command: 'splitw -h -c #{pane_current_path}'
      - name: Split vertical
        key: '-'
        command: 'splitw -v -c #{pane_current_path}'
      - name: Rotate
        key: o
        command: rotatew
        transient: true
      - name: Rotate reverse
        key: O
        command: rotatew -D
        transient: true
      - separator: true
      - name: Rename
        key: R
        command: command-prompt -p "Rename window:" -I "#W" "renamew -- \"%%\""
      - name: Kill
        key: X
        command: 'confirm -p "Kill window #W? (y/n)" killw'

  - name: +Panes
    key: p
    menu:
      - name: Last
        key: tab
        command: lastp
      - name: Choose
        key: p
        command: displayp -d 0
      - separator: true
      - name: Left
        key: h
        command: selectp -L
      - name: Down
        key: j
        command: selectp -D
      - name: Up
        key: k
        command: selectp -U
      - name: Right
        key: l
        command: selectp -R
      - separator: true
      - name: Zoom
        key: z
        command: resizep -Z
      - name: +Resize
        key: r
        menu:
          - name: Left
            key: h
            command: resizep -L
            transient: true
          - name: Down
            key: j
            command: resizep -D
            transient: true
          - name: Up
            key: k
            command: resizep -U
            transient: true
          - name: Right
            key: l
            command: resizep -R
            transient: true
          - name: Left more
            key: H
            command: resizep -L 10
            transient: true
          - name: Down more
            key: J
            command: resizep -D 10
            transient: true
          - name: Up more
            key: K
            command: resizep -U 10
            transient: true
          - name: Right more
            key: L
            command: resizep -R 10
            transient: true
      - name: Swap left
        key: H
        command: swapp -t "{left-of}"
      - name: Swap down
        key: J
        command: swapp -t "{down-of}"
      - name: Swap up
        key: K
        command: swapp -t "{up-of}"
      - name: Swap right
        key: L
        command: swapp -t "{right-of}"
      - name: Break to own window
        key: '!'
        command: break-pane
      - separator: true
      - name: Mark
        key: m
        command: selectp -m
      - name: Unmark
        key: M
        command: selectp -M
      - name: Capture
        key: C
        command: capture-pane
      - name: Respawn pane
        key: R
        macro: restart-pane
      - name: Kill
        key: X
        command: 'confirm -p "Kill pane #P? (y/n)" killp'

  - name: +Buffers
    key: b
    menu:
      - name: Choose
        key: b
        command: choose-buffer -Z
      - name: List
        key: l
        command: lsb
      - name: Paste
        key: p
        command: pasteb

  - name: +Sessions
    key: s
    menu:
      - name: Choose
        key: s
        command: choose-tree -Zs
      - name: New
        key: N
        command: new
      - name: Rename
        key: r
        command: command-prompt -p "Rename session:" -I "#S" "rename-session -- \"%%\""

  - name: +Client
    key: C
    menu:
      - name: Choose
        key: c
        command: choose-client -Z
      - name: Last
        key: l
        command: switchc -l
      - name: Previous
        key: p
        command: switchc -p
      - name: Next
        key: n
        command: switchc -n
      - separator: true
      - name: Refresh
        key: R
        command: refresh
      - name: +Plugins
        key: P
        menu:
          - name: Install
            key: i
            command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/install_plugins
          - name: Update
            key: u
            command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/update_plugins
          - name: Clean
            key: c
            command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/clean_plugins
      - name: Detach
        key: D
        command: detach
      - name: Suspend
        key: Z
        command: suspendc
      - separator: true
      - name: Reload config
        key: r
        macro: reload-config
      - name: Customize
        key: ','
        command: customize-mode -Z

  - separator: true
  - name: Time
    key: C-t
    command: clock-mode
  - name: Show messages
    key: M
    command: show-messages
  - name: +Keys (raw list-keys)
    key: '?'
    command: list-keys -N
