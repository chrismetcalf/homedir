# remap prefix to Control + a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Send prefix in nested sessions
bind a send-prefix

# Splits
bind - split-window -v
bind | split-window -h

# Vault Console — prefix + V prompts for a name and opens Claude Code (as me, krezel)
# in the vault root with Remote Control on. Mirrors the `vault-claude` shell function;
# edit the prefilled "vault" to e.g. "vault-research". Empty -> tmux/claude auto-name.
bind V command-prompt -p "vault session name:" -I "vault" "new-window -c /opt/docker-config/obsidian/Metcalf -n '%1' 'claude --remote-control %1'"

# Mouse mode for selection
set-option -g mouse on

# Quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

# Toggle to last window with Space
bind Space last-window

# Quick session swapping
bind s choose-tree

# Window notifications
setw -g monitor-activity on
set -g visual-activity on

# Automatically rename window title
setw -g automatic-rename on

# My number keys start at 1, so start indexes at 1
set -g base-index 1
# Renumber remaining windows when one is closed (no gaps in 1-N)
set -g renumber-windows on
# Killing the last pane in a session detaches instead of destroying the session
set -g detach-on-destroy off

# Manual reload (tmux-autoreload covers it, but useful as an escape hatch)
bind r source-file ~/.tmux.conf \; display "reloaded"

# Keep key env variables around
set -g update-environment -r

# Clipboard passthrough
set -g allow-passthrough on

# Set window titles
set -g set-titles on
set -g set-titles-string 'tmux: #{pane_current_command} - #T'

# Dim inactive windows
set -g window-style 'fg=colour247,bg=black'
set -g window-active-style 'fg=colour250,bg=black'
set -g pane-border-style 'fg=colour38,bg=colour233'
set -g pane-active-border-style 'fg=colour38,bg=colour233'

#### Tmux Plugin Manager

# Official plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
# Route every yank through tmux's buffer + OSC 52 to the host terminal,
# instead of tmux-yank's autodetected xclip/pbcopy (xclip fails silently
# on a headless server). Works on Tabby (Mac/Win) and ShellFish (iOS).
set -g @override_copy_command 'tmux load-buffer -w -'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Unofficial
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'sainnhe/tmux-fzf'

# which-key style popup: prefix + ? shows every binding as a labelled menu, and
# each menu key drills into the next level. Config (trigger keys + the menu
# tree) lives in .config/tmux/plugins/tmux-which-key/config.yaml — XDG mode is
# on so the config is versioned in this repo instead of under .tmux/plugins/.
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @tmux-which-key-xdg-enable 1

set -g @plugin 'laktak/extrakto'
set -g @extrakto_grab_area 'window full'
set -g @extrakto_split_direction 'v'

set -g @plugin 'qeesung/tmux-scout'
set -g @scout-key "`"    # default: O (prefix + O) — opens the session picker
set -g status-interval 5  # NOTE: tmux-powerline's main.tmux overrides this to its
                          # own default when it loads via tpm below; the real value
                          # is re-asserted after the tpm line at the bottom.

# prefix + ~ : jump straight to the next agent pane awaiting input (the shifted
# `~` sits right on top of the picker's `` ` `` key). Reuses scout's wait state.
bind '~' run-shell -b 'tmux-scout-next-wait'

# Persistent window sidebar: a narrow left pane listing every window (index +
# name + tmux-scout state color), for when there are too many tabs to read in the
# bottom bar. prefix + W toggles it for the session; while on, the follow hooks
# add it to windows you visit or create. See bin/tmux-window-sidebar.
set -g @sidebar off
set -g @sidebar-width 24
bind W run-shell -b 'tmux-sidebar-toggle'
set-hook -g after-select-window 'run-shell -b "tmux-sidebar-ensure"'
set-hook -g after-new-window 'run-shell -b "tmux-sidebar-ensure"'
# Keep the sidebar pinned to @sidebar-width when the terminal resizes (tmux
# otherwise rescales pane widths proportionally, so it drifts / looks wonky).
set-hook -g window-resized 'run-shell -b "tmux-sidebar-resize"'
# Click a row in the sidebar to jump to that window; every other pane click
# keeps tmux's default select-pane + passthrough (so copy-mode drag etc. work).
bind -n MouseDown1Pane if -F '#{@sidebar-pane}' {
  run-shell -b "tmux-sidebar-click #{mouse_y} #{session_name}"
} {
  select-pane -t=
  send -M
}

# Mobile / ShellFish-friendly bindings. Chords are awkward on a phone keyboard,
# so expose a TAPPABLE popup menu (mouse mode is on — tap a row) plus one-key
# actions that make clean ShellFish snippets. See docs/shellfish-tmux-snippets.md.
# prefix + m used to open a hand-rolled display-menu; it now opens which-key's
# root menu, same as prefix + ? (bound after tpm, where the alias exists).
bind b break-pane                 # current split -> its own full window

# Match the powerline theme bg (235) on everything that otherwise falls back
# to terminal default — without these, gaps between status segments and tabs
# render as white blocks. status-bg/fg are deprecated but still honored by
# tmux and trump status-style when set to "default", so set them explicitly.
set -g status-bg colour235
set -g status-fg colour255
set -g status-style bg=colour235,fg=colour255
set -g status-left-style bg=colour235,fg=colour255
set -g status-right-style bg=colour235,fg=colour255
set -g window-status-style bg=colour235,fg=colour255
set -g window-status-current-style bg=colour235,fg=colour255
# Activity/bell defaults are "reverse" which flips bg to white. Keep bg dark
# and use an underscore for activity, bold+red fg for bell.
set -g window-status-activity-style bg=colour235,underscore
set -g window-status-bell-style bg=colour235,fg=colour203,bold

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# tmux-powerline's main.tmux forces status-interval to its own default (1) as it
# loads above, which restacks status renders faster than they finish and pegs the
# box (fork storm). Re-assert a saner interval AFTER tpm so it wins.
set -g status-interval 5

# tmux-powerline also points window-status-format at a SHELL CALLOUT
# ("#(powerline.sh window-format)"), so tmux forks a bash — which itself runs
# `tmux display -p` — for every window on every status redraw. With 13 windows
# of live agent panes that measured ~1,180 forks and ~88k context switches per
# second while the CPU sat 73% idle: the box felt wedged from scheduler churn,
# not load (2026-08-21).
#
# The callout's output is a CONSTANT format string — every dynamic part
# (@scout-state, window_flags, the /14 name truncation) is a #{} that tmux
# expands natively. So bake the string in and let tmux do it with no shell at
# all. Must come after tpm, which sets the callout version as it loads.
# Re-capture with `~/.tmux/plugins/tmux-powerline/powerline.sh window-format`
# if the theme's colours or separators ever change.
set -g window-status-format '#[fg=colour255,bg=colour235,nobold,noitalics,nounderscore]  #{?#{==:#{@scout-state},wait},#[fg=colour203],#{?#{==:#{@scout-state},busy},#[fg=colour214],#{?#{==:#{@scout-state},done},#[fg=colour78],}}}#I#{?window_flags,#F, }  #{=/14/…:window_name} '
set -g window-status-current-format '#[fg=colour231,bg=colour235,bold,nounderscore] #{?#{==:#{@scout-state},wait},#[fg=colour203],#{?#{==:#{@scout-state},busy},#[fg=colour214],#{?#{==:#{@scout-state},done},#[fg=colour78],}}}#I#F  #{=/14/…:window_name} #[fg=colour255,bg=colour235,nobold,noitalics,nounderscore]'

# Second door to the which-key menu for phone use. show-wk-menu-root is a
# command-alias the plugin defines as it loads, so this has to come after tpm —
# and behind an if-shell, or a host that hasn't run prefix + I yet fails config
# parsing with "unknown command" (if-shell defers parsing until the test passes).
if-shell '[ -f ~/.tmux/plugins/tmux-which-key/plugin.sh.tmux ]' 'bind m show-wk-menu-root'
