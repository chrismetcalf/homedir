# remap prefix to Control + a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Send prefix in nested sessions
bind a send-prefix

# Splits
bind - split-window -v
bind | split-window -h

# Vault Console — prefix + V prompts for a name and opens Claude Code (as me, krezel)
# in the vault root with Remote Control on. Mirrors the `vault-claude` shell function;
# edit the prefilled "vault" to e.g. "vault-research". Empty -> tmux/claude auto-name.
bind V command-prompt -p "vault session name:" -I "vault" "new-window -c /opt/docker-config/obsidian/Metcalf -n '%1' 'claude --remote-control %1'"

# Mouse mode for selection
set-option -g mouse on

# Quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

# Toggle to last window with Space
bind Space last-window

# Quick session swapping
bind s choose-tree

# Window notifications
setw -g monitor-activity on
set -g visual-activity on

# Automatically rename window title
setw -g automatic-rename on

# Explicit, not inferred. tmux picks mode-keys by looking for "vi" in $EDITOR or
# $VISUAL *in the server's environment at server start* -- and that environment
# is frozen at startup, before .zshrc sets either. So despite EDITOR=nvim the
# server saw neither and defaulted to emacs, which left every copy-mode-vi
# binding (V select-line, v rectangle-toggle, y yank) unreachable.
setw -g mode-keys vi

# My number keys start at 1, so start indexes at 1
set -g base-index 1
# Renumber remaining windows when one is closed (no gaps in 1-N)
set -g renumber-windows on
# Killing the last pane in a session detaches instead of destroying the session
set -g detach-on-destroy off

# Manual reload (tmux-autoreload covers it, but useful as an escape hatch)
bind r source-file ~/.tmux.conf \; display "reloaded"

# Keep key env variables around
set -g update-environment -r

# Put ~/bin on the SERVER's PATH. A tmux server caches its environment at start
# and never re-reads it, so a server launched by something that doesn't source
# the interactive shell (Secure ShellFish's connect command does exactly this)
# has no ~/bin — and every bare-name script below dies with exit 127:
# tmux-sidebar-{resize,ensure,toggle,click} and tmux-scout-next-wait. The
# symptom is a "'tmux-sidebar-resize' returned 127" popup on every reconnect,
# and it appeared the moment a 33-day-old server was replaced (2026-08-25).
# tmarchy is immune because it invokes everything by absolute path.
#
# Guarded so repeated `prefix + r` doesn't stack duplicate entries.
run-shell 'case ":$PATH:" in *":$HOME/bin:"*) ;; *) tmux set-environment -g PATH "$HOME/bin:$PATH" ;; esac'

# Same guard for ~/.local/bin, and for the same reason -- but this one bites
# differently. A menu entry like "New vault session" runs its command DIRECTLY
# (new-window ... "claude --remote-control %1"), not through a login shell, so
# it gets the server's cached PATH rather than the one .zshrc.local builds.
# With ~/.local/bin missing, `claude` resolved to a stale root-owned
# /usr/local/bin/claude from June -- 2.1.169, which predates Opus 5 -- while
# every ordinary pane ran 2.1.251. Prepended, so it wins over /usr/local/bin.
run-shell 'case ":$PATH:" in *":$HOME/.local/bin:"*) ;; *) tmux set-environment -g PATH "$HOME/.local/bin:$PATH" ;; esac'

# Clipboard passthrough
set -g allow-passthrough on

# Set window titles
set -g set-titles on
set -g set-titles-string 'tmux: #{pane_current_command} - #T'

# Dim inactive windows
set -g window-style 'fg=colour247,bg=black'
set -g window-active-style 'fg=colour250,bg=black'
# Fallback only: tmarchy's bar.conf overrides both from the active theme when it
# loads after tpm. These are what a host without tmarchy gets.
set -g pane-border-style 'fg=colour38,bg=colour233'
set -g pane-active-border-style 'fg=colour38,bg=colour233'

#### Tmux Plugin Manager

# Official plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
# Route every yank through tmux's buffer + OSC 52 to the host terminal,
# instead of tmux-yank's autodetected xclip/pbcopy (xclip fails silently
# on a headless server). Works on Tabby (Mac/Win) and ShellFish (iOS).
set -g @override_copy_command 'tmux load-buffer -w -'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Unofficial
# Retired by tmarchy 2026-08-25. COMMENTED, NOT DELETED: tpm leaves the plugin
# directory on disk, so the code to roll back to still exists.
#
# ROLLBACK IS `git checkout 2d92d6b^ -- .tmux.conf`, NOT uncommenting this line.
# (2d92d6b^ is 85d4fd3, the last pre-tmarchy revision of this file.) tmarchy's
# entire takeover of the tmux config lives in this one file — 2d92d6b touched
# nothing else — so restoring it to its pre-tmarchy revision IS the complete
# rollback. It is one command, it cannot conflict, and unlike a revert it stays
# correct no matter how many later commits edit this comment block.
#
# `git revert 2d92d6b` alone is WRONG, and has now been the documented
# instruction twice. f2bbe0c rewrote this same block, so reverting only the
# earlier commit conflicts right here — in the emergency procedure, during the
# emergency. `git revert --no-commit f2bbe0c 2d92d6b` does apply cleanly today,
# but it is a chain that must grow by hand with every future edit to this file,
# which is the failure mode above waiting to happen again. Use the checkout.
#
# Uncommenting alone does NOT restore the pre-tmarchy state — it restores
# something worse. 2d92d6b also deleted the baked-in native window formats and
# the post-tpm `status-interval 5`, both of which were holding powerline in
# check, so uncommenting hands it back its per-window #() callout at interval 1:
# the 2026-08-21 fork storm, verbatim (12 windows x 1 Hz x a forked shell, 1,180
# forks/sec at 73% idle CPU). Verified by running it on a throwaway server.
#
# Task 7 (9cddda7) does not need reverting: it updated
# .config/tmux-powerline/segments/tmux_scout.sh to the renamed ticker path in
# its own commit, so powerline's scout segment still works either way.
#
# Afterwards, `tmux source-file ~/.tmux.conf` (or prefix + r) to apply it live.
# See docs/superpowers/specs/2026-08-25-tmarchy-design.md
# set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'sainnhe/tmux-fzf'

# which-key style popup: prefix + ? shows every binding as a labelled menu, and
# each menu key drills into the next level. Config (trigger keys + the menu
# tree) lives in .config/tmux/plugins/tmux-which-key/config.yaml — XDG mode is
# on so the config is versioned in this repo instead of under .tmux/plugins/.
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @tmux-which-key-xdg-enable 1

set -g @plugin 'laktak/extrakto'
set -g @extrakto_grab_area 'window full'
set -g @extrakto_split_direction 'v'

set -g @plugin 'qeesung/tmux-scout'
set -g @scout-key "`"    # default: O (prefix + O) — opens the session picker
set -g status-interval 5  # NOTE: tmarchy's bar.conf owns this value now and sets
                          # it again after tpm. Kept here so a host that hasn't
                          # got tmarchy on disk yet still gets a sane interval.

# prefix + ~ : jump straight to the next agent pane awaiting input (the shifted
# `~` sits right on top of the picker's `` ` `` key). Reuses scout's wait state.
bind '~' run-shell -b 'tmux-scout-next-wait'

# Persistent window sidebar: a narrow left pane listing every window (index +
# name + tmux-scout state color), for when there are too many tabs to read in the
# bottom bar. prefix + W toggles it for the session; while on, the follow hooks
# add it to windows you visit or create. See bin/tmux-window-sidebar.
set -g @sidebar off
set -g @sidebar-width 24
bind W run-shell -b 'tmux-sidebar-toggle'
set-hook -g after-select-window 'run-shell -b "tmux-sidebar-ensure"'
set-hook -g after-new-window 'run-shell -b "tmux-sidebar-ensure"'
# Keep the sidebar pinned to @sidebar-width when the terminal resizes (tmux
# otherwise rescales pane widths proportionally, so it drifts / looks wonky).
set-hook -g window-resized 'run-shell -b "tmux-sidebar-resize"'
# Click a row in the sidebar to jump to that window; every other pane click
# keeps tmux's default select-pane + passthrough (so copy-mode drag etc. work).
bind -n MouseDown1Pane if -F '#{@sidebar-pane}' {
  run-shell -b "tmux-sidebar-click #{mouse_y} #{session_name}"
} {
  select-pane -t=
  send -M
}

# Mobile / ShellFish-friendly bindings. Chords are awkward on a phone keyboard,
# so expose a TAPPABLE popup menu (mouse mode is on — tap a row) plus one-key
# actions that make clean ShellFish snippets. See docs/shellfish-tmux-snippets.md.
# prefix + m used to open a hand-rolled display-menu; it now opens which-key's
# root menu, same as prefix + ? (bound after tpm, where the alias exists).
bind b break-pane                 # current split -> its own full window

# prefix + g: ask Claude for a shell command and INSERT it at the prompt without
# running it. Toolless by construction — the query has no filesystem access — so
# a wrong answer costs a wasted popup, not a deleted directory. See bin/tmux-gen.
# Absolute path, not a bare name: the sidebar hooks broke with exit 127 when a
# server started without ~/bin on its PATH, and this binding must not repeat it.
#
# Wrapped in run-shell, not a direct display-popup bind: display-popup's own
# shell-command argument is NOT format-expanded (verified on tmux 3.5a — #{pane_id}
# reaches the popup as the literal six characters, and every insert then fails
# with "can't find pane: #{pane_id}"). run-shell's argument IS expanded per the
# FORMATS section, so #{pane_id} becomes a concrete %N before display-popup ever
# sees it. -b keeps the popup from blocking tmux's command queue while it's open.
bind g display-popup -E -w 80% -h 60% "~/bin/tmux-gen"

# prefix + u: one picker over sessions, windows and panes together — no
# category to choose first, which is the part of prefix + F that breaks the
# flow. Navigation only; prefix + F keeps its nine modes for running things.
bind u display-popup -E -w 70% -h 60% "~/bin/tmux-goto"

# prefix + S: fuzzy-pick a host and ssh to it. known_hosts is hashed here and
# ~/.ssh/config is one Include plus a Host * catch-all, so the hosts actually
# come from tailscale; the config's own entries win where they overlap because
# they may carry a user, port or ProxyJump. Enter opens a window named for the
# host, Ctrl-V splits instead.
bind S display-popup -E -w 60% -h 70% "~/bin/tmux-ssh"

# prefix + p: command palette, cmd-P style. Flattens the which-key menu into one
# fuzzy list so a command four levels deep is one search away, and shows each
# entry's key so the keys get learned rather than replaced. This takes over
# tmux's default previous-window, which C-p still does.
bind p display-popup -E -w 70% -h 70% "~/bin/tmux-cmd"

# prefix + B: drop-down btop. Not b -- that is break-pane, above.
#
# A real toggle: inside the overlay the same key detaches the popup's client,
# which closes it. if-shell -F evaluates the format directly rather than forking
# a shell, so this costs nothing per keypress.
#
# btop runs in its own detached session (bin/tmux-btop), so the process survives
# between glances -- a popup running `btop` directly would start a fresh one
# every toggle, losing its history graphs -- and it stays out of the tab bar.
bind B if-shell -F '#{==:#{session_name},_btop}' 'detach-client' 'display-popup -E -w 90% -h 90% "~/bin/tmux-btop"'


# Status-line colours are tmarchy's: bar.conf sets status-style and both tab
# formats from the active theme's palette. The hardcoded colour-235 block that
# used to live here (status-bg/fg/style, status-left/right-style,
# window-status-style/current-style) existed only to match tmux-powerline's
# background and went out with it — see the tmarchy load after tpm.
#
# Activity/bell stay: bar.conf overrides both on a host that has tmarchy, but
# the tmux defaults are "reverse", which flips the tab background to white on a
# fresh checkout where the if-shell guard below hasn't found tmarchy yet.
set -g window-status-activity-style bg=colour235,underscore
set -g window-status-bell-style bg=colour235,fg=colour203,bold

# DELETING a `set` line does not unset the option in an already-running server —
# source-file only applies what it reads. A server that was up before the block
# above was removed therefore keeps colour235 forever, and status-bg/status-fg
# are the deprecated aliases that WIN over status-style, so the bar would still
# draw powerline's background under tmarchy's theme. Unset them explicitly so a
# live reload converges on the same state as a fresh server. No-ops on a fresh
# one; bar.conf (after tpm) has the last word either way.
set -gu status-bg
set -gu status-fg
set -gu status-left-style
set -gu status-right-style
set -gu window-status-style
set -gu window-status-current-style

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# tmarchy owns the status bar: theme, segments, tabs. Loaded explicitly AFTER
# tpm rather than as a tpm plugin, because three separate incidents in this
# repo have come from tpm load ordering. if-shell guards a fresh checkout.
#
# It replaces three blocks that used to live here: the post-tpm status-interval
# re-assertion (powerline's main.tmux reset it to 1), and the
# window-status-format / window-status-current-format strings baked in by
# ba1aa74 to stop powerline forking a shell per window per redraw. bar.conf
# sets all three natively, and the governing rule stands: node runs at most
# once per status-interval (see tmarchy/README.md's "governing invariant" —
# the guard's #() itself does still fork a shell on every invocation, it just
# never starts node unless an interval has actually elapsed).
if-shell '[ -f ~/.homedir/tmarchy/tmarchy.tmux ]' 'run-shell ~/.homedir/tmarchy/tmarchy.tmux'

# Name a window after the host it is ssh'd into, even when the window already
# has a name of its own. Without this only windows tmux is still auto-naming
# get taken over, which excludes every window opened with -n -- agent
# worktrees, and anything tmux-ssh itself opens.
#
# Reversible by design: the old name is stashed in @tmarchy-ssh-prev and put
# back verbatim when the session ends. Set this to `auto` (or unset it) to go
# back to leaving named windows alone.
set -g @tmarchy-ssh-rename always

# Second door to the which-key menu for phone use. show-wk-menu-root is a
# command-alias the plugin defines as it loads, so this has to come after tpm —
# and behind an if-shell, or a host that hasn't run prefix + I yet fails config
# parsing with "unknown command" (if-shell defers parsing until the test passes).
if-shell '[ -f ~/.tmux/plugins/tmux-which-key/plugin.sh.tmux ]' 'bind m show-wk-menu-root'
