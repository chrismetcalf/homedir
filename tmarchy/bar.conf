# tmarchy bar. Every value here is a tmux format: the single #() below is the
# only shell-out in this file. tmux does fork a shell for it -- once per
# status-interval per attached client, plus once per explicit
# `refresh-client -S` -- but that shell is the guard, which exits on bash
# builtins alone; node (the ticker itself) runs at most once per interval. The
# #() prints nothing and exists only to refresh the @bar-* options this file
# reads.
#
# Values are one status-interval stale by design: options written during a
# render are consumed by the next one. At 5s that is invisible.

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5  # authoritative: this file is sourced after tpm, so it
                          # wins over .tmux.conf's pre-tpm copy, which exists only
                          # as the fallback for a host without tmarchy. Change both.
set -g status-left-length 60
set -g status-right-length 140

set -g status-style "bg=#{@theme-bg},fg=#{@theme-fg}"
set -g message-style "bg=#{@theme-bg},fg=#{@theme-accent}"

# Menus are part of the palette too. tmux ships menu-selected-style as a
# hardcoded bg=yellow, so without these the which-key popup (prefix + ? / m)
# stays terminal-default with a yellow selection bar while the bar and tabs
# follow the theme — the one surface that visibly did not switch.
set -g menu-style "bg=#{@theme-bg},fg=#{@theme-fg}"
set -g menu-selected-style "bg=#{@theme-accent},fg=#{@theme-bg},bold"
set -g menu-border-style "fg=#{@theme-border}"
set -g menu-border-lines rounded

# Everything else tmux can colour. Each of these ships with a hardcoded default
# — yellow, cyan, magenta, blue — that ignores the theme entirely, so switching
# palettes left them looking pasted in from another program. mode-style is the
# one you notice first: it is the selection bar in choose-tree (prefix + s and
# prefix + w), i.e. the window listing.
#
# popup-style matters more than it looks now that tmux-gen (prefix + g) draws in
# a popup: without it the command generator renders on the terminal's default
# background rather than the theme's.
set -g mode-style "bg=#{@theme-accent},fg=#{@theme-bg},bold"
set -g message-command-style "bg=#{@theme-bg},fg=#{@theme-accent-alt}"
set -g popup-style "bg=#{@theme-bg},fg=#{@theme-fg}"
set -g popup-border-style "fg=#{@theme-border}"
set -g popup-border-lines rounded

# Copy-mode search: matches in the busy amber, the CURRENT match in the accent
# so it is distinguishable at a glance, marks in the secondary accent.
set -g copy-mode-match-style "bg=#{@theme-busy},fg=#{@theme-bg}"
set -g copy-mode-current-match-style "bg=#{@theme-accent},fg=#{@theme-bg},bold"
set -g copy-mode-mark-style "bg=#{@theme-accent-alt},fg=#{@theme-bg}"

# display-panes-colour, display-panes-active-colour and clock-mode-colour are
# deliberately NOT here. They are colour-type options, not style-type: tmux
# validates them when set and rejects a format outright ("bad colour:
# #{@theme-dim}"), so the @theme-* indirection every other line here relies on
# cannot work for them. tmarchy.tmux resolves them to concrete values after the
# theme loads instead.
set -g pane-border-style "fg=#{@theme-border}"
set -g pane-active-border-style "fg=#{@theme-accent}"

# Left: just the session. The remote host used to sit here too, but status-left
# reads as a property of the whole session, so one pane's ssh made every window
# look remote. The host now names the window itself (lib/ssh-name.js) and the
# tab keeps its remote glyph, which is where it belongs.
# Per-client, not per-session: tmux expands status formats separately for each
# attached client, so the phone (50 cols) and the desktop (178) can render
# different bars from the same session. The comparison must be #{e|<:...} --
# a bare #{<:...} compares as STRINGS, which makes "178" < "80" true and every
# client narrow.
set -g status-left "#[fg=#{@theme-accent},bold]#{?#{e|<:#{client_width},80},󰆍 ,󰆍 #S}#[default] "
# Deleting the format above does not clear a value a previous tick already set,
# and a running server would keep rendering it.
set -gu @bar-remote

# Right: the ticker (silent, behind its rate guard), then each segment, each
# vanishing when empty. tmux re-runs this #() roughly once per status-interval
# per attached client, plus once per explicit `refresh-client -S` -- pane
# output does not drive it. That can still add up (a low interval, several
# attached clients, or a refresh-client caller), so tmarchy-tick-guard is
# bash-builtins-only and drops all but one call per status-interval before
# node is ever started.
# Quota leads status-right because it only ever renders when something is
# wrong: the segment returns null below 80%, so an empty @bar-quota is the
# normal state and this slot is invisible. @theme-wait is the attention
# colour here rather than the scout state -- by construction nothing reaches
# this slot unless it wants attention.
set -g status-right "#(#{@tmarchy-dir}/bin/tmarchy-tick-guard)#{?#{e|<:#{client_width},80},#{?#{@bar-quota},#[fg=#{@theme-wait}]󰀦 #{@bar-quota}#[default] ,},#{?#{@bar-quota},#[fg=#{@theme-wait}]󰀦 #{@bar-quota}#[default]   ,}#{?#{@bar-agents},#[fg=#{@theme-accent-alt}]󰚩 #{@bar-agents}#[default]   ,}#{?#{@bar-branch},#[fg=#{@theme-done}]󰘬 #{@bar-branch}#[default]   ,}#{?#{@bar-load},#[fg=#{@theme-dim}]󰓅 #{@bar-load}#[default]   ,}#{?#{@bar-battery},#[fg=#{@theme-dim}]#{@bar-battery}#[default]   ,}#[fg=#{@theme-fg}]%H:%M  }"

setw -g window-status-separator ""

# Tabs: index tinted by scout state, a remote glyph when applicable, name
# truncated to 14 chars so many agent-worktree tabs stay readable.
set -g window-status-format "#[fg=#{@theme-dim}]  #{?#{==:#{@scout-state},wait},#[fg=#{@theme-wait}],#{?#{==:#{@scout-state},busy},#[fg=#{@theme-busy}],#{?#{==:#{@scout-state},done},#[fg=#{@theme-done}],#[fg=#{@theme-dim}]}}}#I #{?#{@remote-host},#[fg=#{@theme-remote}]󰢹 ,}#[fg=#{@theme-dim}]#{?#{e|<:#{client_width},80},#{=/7/…:window_name},#{=/14/…:window_name}}#{?window_flags,#F,} "

set -g window-status-current-format "#[fg=#{@theme-fg},bold]  #{?#{==:#{@scout-state},wait},#[fg=#{@theme-wait}],#{?#{==:#{@scout-state},busy},#[fg=#{@theme-busy}],#{?#{==:#{@scout-state},done},#[fg=#{@theme-done}],#[fg=#{@theme-accent}]}}}#I #{?#{@remote-host},#[fg=#{@theme-remote}]󰢹 ,}#[fg=#{@theme-fg},bold]#{?#{e|<:#{client_width},80},#{=/7/…:window_name},#{=/14/…:window_name}}#{?window_flags,#F,} "

set -g window-status-activity-style "none"
set -g window-status-bell-style "fg=#{@theme-wait},bold"
