# Jewel — the pre-tmarchy palette from .config/tmux-powerline/themes/chrismetcalf.sh
set -g @theme-bg         "colour235"
set -g @theme-fg         "colour255"
set -g @theme-dim        "colour244"
set -g @theme-accent     "colour178"
set -g @theme-accent-alt "colour67"
set -g @theme-border     "colour238"
set -g @theme-wait       "colour203"
set -g @theme-busy       "colour214"
set -g @theme-done       "colour78"
set -g @theme-remote     "colour67"

# Downstream theme names. bat and nvim need a real syntax theme by NAME:
# ten semantic colours cannot express what a highlighter does with them, so
# this maps rather than synthesises.
# APPROXIMATE: nvim's built-in `retrobox` is the closest saturated dark, so no plugin; bat has no match.
set -g @theme-nvim       "retrobox"
set -g @theme-bat        "Monokai Extended"
