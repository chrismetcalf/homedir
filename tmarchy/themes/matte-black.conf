# Matte Black
set -g @theme-bg         "#121212"
set -g @theme-fg         "#eaeaea"
set -g @theme-dim        "#8a8a8a"
set -g @theme-accent     "#d4d4d4"
set -g @theme-accent-alt "#a0a0a0"
set -g @theme-border     "#333333"
set -g @theme-wait       "#d75f5f"
set -g @theme-busy       "#d7af5f"
set -g @theme-done       "#87af87"
set -g @theme-remote     "#87afd7"
# Four more roles, needed by the prompt rather than the bar: a secondary
# data colour, a tertiary accent, a critical level above `busy`, and a
# foreground dimmer than `fg` but lighter than `dim`.
set -g @theme-info         "#87afaf"  # muted teal
set -g @theme-accent-muted "#767676"  # deep grey
set -g @theme-alert        "#d7875f"  # muted orange
set -g @theme-fg-muted     "#b2b2b2"  # light grey

# Downstream theme names. bat and nvim need a real syntax theme by NAME:
# ten semantic colours cannot express what a highlighter does with them, so
# this maps rather than synthesises.
# APPROXIMATE: nvim's built-in `quiet` is near-monochrome, so this needs no plugin; bat has no match, TwoDark is a neutral dark.
set -g @theme-nvim       "quiet"
set -g @theme-bat        "TwoDark"
