# Everforest Dark Medium
set -g @theme-bg         "#2d353b"
set -g @theme-fg         "#d3c6aa"
set -g @theme-dim        "#859289"
set -g @theme-accent     "#a7c080"
set -g @theme-accent-alt "#d699b6"
set -g @theme-border     "#475258"
set -g @theme-wait       "#e67e80"
set -g @theme-busy       "#dbbc7f"
set -g @theme-done       "#83c092"
set -g @theme-remote     "#7fbbb3"

# Downstream theme names. bat and nvim need a real syntax theme by NAME:
# ten semantic colours cannot express what a highlighter does with them, so
# this maps rather than synthesises.
# APPROXIMATE: bat has no everforest; zenburn is the closest warm-olive built-in.
set -g @theme-nvim       "everforest"
set -g @theme-bat        "zenburn"
