# Gruvbox Dark
set -g @theme-bg         "#282828"
set -g @theme-fg         "#ebdbb2"
set -g @theme-dim        "#928374"
set -g @theme-accent     "#83a598"
set -g @theme-accent-alt "#d3869b"
set -g @theme-border     "#504945"
set -g @theme-wait       "#fb4934"
set -g @theme-busy       "#fabd2f"
set -g @theme-done       "#b8bb26"
set -g @theme-remote     "#8ec07c"

# Downstream theme names. bat and nvim need a real syntax theme by NAME:
# ten semantic colours cannot express what a highlighter does with them, so
# this maps rather than synthesises.
set -g @theme-nvim       "gruvbox"
set -g @theme-bat        "gruvbox-dark"
