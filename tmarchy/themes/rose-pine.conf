# Rose Pine
#
# @theme-done uses foam, not pine. Rose Pine's core palette has no true green;
# pine (#31748f) was the closest available and only clears 3.38:1 against
# @theme-bg -- marginal, and pine reads as a muted background-ish accent
# upstream rather than a foreground indicator. foam is a legitimate upstream
# foreground role and clears 10.37:1.
#
# @theme-remote uses subtle, not foam. foam moved to @theme-done above, and
# window-status-format renders a window's scout-state tint and its remote
# glyph side by side in the same tab -- reusing foam for both would make a
# window that is simultaneously "done" and "remote" (a finished agent running
# over ssh) render both indicators in the same colour. subtle is Rose Pine's
# own "medium contrast foreground" role, upstream-documented for exactly this
# kind of secondary indicator (inactive tabs, punctuation), and clears 5.48:1.
set -g @theme-bg         "#191724"
set -g @theme-fg         "#e0def4"
set -g @theme-dim        "#6e6a86"
set -g @theme-accent     "#c4a7e7"
set -g @theme-accent-alt "#ebbcba"
set -g @theme-border     "#403d52"
set -g @theme-wait       "#eb6f92"
set -g @theme-busy       "#f6c177"
set -g @theme-done       "#9ccfd8"
set -g @theme-remote     "#908caa"
