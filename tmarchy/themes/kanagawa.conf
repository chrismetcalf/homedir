# Kanagawa Wave
set -g @theme-bg         "#1f1f28"
set -g @theme-fg         "#dcd7ba"
set -g @theme-dim        "#727169"
set -g @theme-accent     "#7e9cd8"
set -g @theme-accent-alt "#957fb8"
set -g @theme-border     "#54546d"
set -g @theme-wait       "#e82424"
set -g @theme-busy       "#ff9e3b"
set -g @theme-done       "#98bb6c"
set -g @theme-remote     "#7aa89f"
# Four more roles, needed by the prompt rather than the bar: a secondary
# data colour, a tertiary accent, a critical level above `busy`, and a
# foreground dimmer than `fg` but lighter than `dim`.
set -g @theme-info         "#7fb4ca"  # springBlue
set -g @theme-accent-muted "#938aa9"  # springViolet1
set -g @theme-alert        "#ffa066"  # surimiOrange
set -g @theme-fg-muted     "#c8c093"  # oldWhite

# Downstream theme names. bat and nvim need a real syntax theme by NAME:
# ten semantic colours cannot express what a highlighter does with them, so
# this maps rather than synthesises.
# APPROXIMATE: bat has no kanagawa; zenburn shares its warm sand foreground.
set -g @theme-nvim       "kanagawa"
set -g @theme-bat        "zenburn"
