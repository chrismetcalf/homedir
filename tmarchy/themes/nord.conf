# Nord
#
# @theme-wait uses nord12 (orange), not nord11 (red). Nord's 16-colour core
# palette defines exactly one true red (nord11, #bf616a) and it only clears
# WCAG contrast against @theme-bg at 3.05:1 -- barely above the 3:1 UI-component
# floor, and the weakest state colour of any shipped theme, on the one state
# `prefix + ~` navigates by. nord12 is the brightest red-family colour Nord
# actually defines (4.39:1) and isn't used by any other role here.
set -g @theme-bg         "#2e3440"
set -g @theme-fg         "#d8dee9"
set -g @theme-dim        "#4c566a"
set -g @theme-accent     "#88c0d0"
set -g @theme-accent-alt "#b48ead"
set -g @theme-border     "#434c5e"
set -g @theme-wait       "#d08770"
set -g @theme-busy       "#ebcb8b"
set -g @theme-done       "#a3be8c"
set -g @theme-remote     "#81a1c1"

# Downstream theme names. bat and nvim need a real syntax theme by NAME:
# ten semantic colours cannot express what a highlighter does with them, so
# this maps rather than synthesises.
set -g @theme-nvim       "nord"
set -g @theme-bat        "Nord"
