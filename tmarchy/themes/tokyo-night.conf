# Tokyo Night. Colour table and downstream theme names. Declarative only — no formats, no logic.
set -g @theme-bg         "#1a1b26"
set -g @theme-fg         "#c0caf5"
set -g @theme-dim        "#565f89"
set -g @theme-accent     "#7aa2f7"
set -g @theme-accent-alt "#bb9af7"
set -g @theme-border     "#3b4261"
set -g @theme-wait       "#f7768e"
set -g @theme-busy       "#e0af68"
set -g @theme-done       "#9ece6a"
set -g @theme-remote     "#7dcfff"

# Downstream theme names. bat and nvim need a real syntax theme by NAME:
# ten semantic colours cannot express what a highlighter does with them, so
# this maps rather than synthesises.
set -g @theme-nvim       "tokyonight-night"
set -g @theme-bat        "tokyonight_night"
