# Catppuccin Mocha
set -g @theme-bg         "#1e1e2e"
set -g @theme-fg         "#cdd6f4"
set -g @theme-dim        "#6c7086"
set -g @theme-accent     "#89b4fa"
set -g @theme-accent-alt "#cba6f7"
set -g @theme-border     "#45475a"
set -g @theme-wait       "#f38ba8"
set -g @theme-busy       "#f9e2af"
set -g @theme-done       "#a6e3a1"
set -g @theme-remote     "#89dceb"
# Four more roles, needed by the prompt rather than the bar: a secondary
# data colour, a tertiary accent, a critical level above `busy`, and a
# foreground dimmer than `fg` but lighter than `dim`.
set -g @theme-info         "#94e2d5"  # teal
set -g @theme-accent-muted "#b4befe"  # lavender
set -g @theme-alert        "#fab387"  # peach
set -g @theme-fg-muted     "#bac2de"  # subtext1

# Downstream theme names. bat and nvim need a real syntax theme by NAME:
# ten semantic colours cannot express what a highlighter does with them, so
# this maps rather than synthesises.
set -g @theme-nvim       "catppuccin-mocha"
set -g @theme-bat        "Catppuccin Mocha"
